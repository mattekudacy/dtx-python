[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drumgame"
version = "0.1.0"
description = "A DTXMania-style rhythm game for electronic drums over MIDI, in Python"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.4",
    "mido>=1.3",
    "python-rtmidi>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
drumgame = "drumgame.main:main"

[tool.setuptools.packages.find]
include = ["drumgame*"]

[tool.setuptools.package-data]
drumgame = ["data/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
