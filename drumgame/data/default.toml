# drumgame defaults. Do not edit this file: put overrides in
# ~/.config/drumgame/config.toml (or pass --config). Only the keys you set
# there change; everything else keeps the value below.

[input]
# Substring of the MIDI input port name to open, e.g. "TD-17". Empty = first
# port that is not ALSA's "Midi Through".
midi_port = ""
# 0 = accept every channel. 10 = only the drum channel (the TD-17 default).
midi_channel = 0
# Per-lane debounce against double triggers and crosstalk. A starting guess:
# tune it on the real kit.
debounce_ms = 30

# Keyboard fallback: pygame key name = lane.
# Esc, Enter, Backspace and F11 are reserved (pause/quit, pause, restart,
# fullscreen).
[input.keyboard]
q = "crash_l"
s = "hihat"
z = "hh_pedal"
d = "snare"
f = "tom_hi"
"space" = "kick"
j = "tom_mid"
k = "tom_floor"
l = "crash_r"
";" = "ride"

# MIDI note number = lane.
#
# !! UNVERIFIED DRAFT !!
# These Roland TD-17 note numbers are from memory of the factory defaults and
# have NOT been checked against a real kit or Roland's MIDI Implementation /
# Data List PDFs. Kits can also be re-assigned per pad on the module. Verify
# every pad with `drumgame --monitor` (or `aseqdump -p "TD-17"`), or run
# `drumgame --learn` to record the real notes and replace this map. Set a note to "" in your own config to ignore it.
[midi_map]
36 = "kick"
38 = "snare"      # head
40 = "snare"      # rim
37 = "snare"      # cross stick
48 = "tom_hi"     # tom 1 head
50 = "tom_hi"     # tom 1 rim
45 = "tom_mid"    # tom 2 head
47 = "tom_mid"    # tom 2 rim
43 = "tom_floor"  # tom 3 head
58 = "tom_floor"  # tom 3 rim
46 = "hihat"      # open bow
26 = "hihat"      # open edge
42 = "hihat"      # closed bow
22 = "hihat"      # closed edge
44 = "hh_pedal"
49 = "crash_l"    # crash 1 bow
55 = "crash_l"    # crash 1 edge
57 = "crash_r"    # crash 2 bow
52 = "crash_r"    # crash 2 edge
51 = "ride"       # bow
59 = "ride"       # edge
53 = "ride"       # bell

[judge]
# Starting values. Do not tune these from keyboard play.
perfect_ms = 50
good_ms = 100
# The gauge beside the highway fills on hits and drains on misses. With
# can_fail on, the song ends when it empties. Turn it off to practise.
can_fail = true

[audio]
sample_rate = 44100
buffer = 256
# Global calibration offset. Positive = judge and draw everything later.
# `drumgame --calibrate` measures and saves this for you.
offset_ms = 0
metronome = true

[video]
# Window size when not fullscreen. The window can be resized, and the whole
# UI scales to fit it. F11 switches fullscreen on and off while playing.
width = 1280
height = 720
fullscreen = false
# Extra size on top of the automatic fit, 0.5 to 2.0. Above 1.0 makes text and
# notes bigger (useful from behind a kit) until the layout runs out of room.
ui_scale = 1.0
fps = 120
# Seconds a note takes to fall from the top of the highway to the hit line.
scroll_seconds = 1.5
# true = no hit beams, and judgement text and pad targets stay still. Pads
# still light up when struck.
reduce_motion = false
# "full" (10 lanes) or "compact" (6 lanes).
layout = "full"
# Optional reordering of the layout's lanes, left to right. Empty = default.
lane_order = []
